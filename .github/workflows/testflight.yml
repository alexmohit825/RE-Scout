name: RE Scout TestFlight Cloud Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build_description:
        description: 'Build Description / TestFlight Release Notes'
        required: false
        default: 'Automated TestFlight build for RE Scout'

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: 🍏 Compile, Archive & Deliver to TestFlight
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Select Xcode 16.0
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: ⚙️ Install XcodeGen
        run: brew install xcodegen

      - name: 🏗️ Generate Native Xcode Project
        run: xcodegen generate

      - name: 🔄 Sync REScout.xcodeproj for Apple Xcode Cloud
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f REScout.xcodeproj
          if git commit -m "chore: auto-sync REScout.xcodeproj for Apple Xcode Cloud & TestFlight"; then
            git push origin main
          fi

      - name: 🔑 Configure App Store Connect API Credentials
        env:
          ASC_KEY_ID: "38F6WA87DU"
          ASC_ISSUER_ID: "73c7355a-beef-4d79-919d-c3d7dec7747a"
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf "%s\n" "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          echo "✓ App Store Connect API Key installed safely."

      - name: 🧪 Validate Apple API Key Connection
        env:
          ASC_KEY_ID: "38F6WA87DU"
          ASC_ISSUER_ID: "73c7355a-beef-4d79-919d-c3d7dec7747a"
        run: |
          echo "Testing connection to Apple App Store Connect servers..."
          xcrun altool --list-apps \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: 📦 Validate iOS Build on Simulator
        run: |
          xcodebuild build \
            -project REScout.xcodeproj \
            -scheme REScout \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
          echo "✓ iOS Target compiled and validated successfully."

      - name: 🚀 Archive Release Candidate for TestFlight
        env:
          ASC_KEY_ID: "38F6WA87DU"
          ASC_ISSUER_ID: "73c7355a-beef-4d79-919d-c3d7dec7747a"
        run: |
          mkdir -p build
          echo "Archiving REScout target for generic iOS device..."
          xcodebuild archive \
            -project REScout.xcodeproj \
            -scheme REScout \
            -configuration Release \
            -archivePath build/REScout.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: 📤 Export IPA Package & Deliver to TestFlight
        env:
          ASC_KEY_ID: "38F6WA87DU"
          ASC_ISSUER_ID: "73c7355a-beef-4d79-919d-c3d7dec7747a"
        run: |
          mkdir -p build/output
          echo "Exporting IPA from archive..."
          xcodebuild -exportArchive \
            -archivePath build/REScout.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/output \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          echo "Exported files in build/output:"
          ls -la build/output

          IPA_PATH=$(find build/output -name "*.ipa" | head -n 1)
          if [ -n "$IPA_PATH" ]; then
            echo "Delivering $IPA_PATH directly to TestFlight via App Store Connect..."
            xcrun altool --upload-app \
              -f "$IPA_PATH" \
              -t ios \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID" \
              --show-progress
            echo "✓ IPA successfully uploaded and verified with Apple TestFlight!"
          else
            echo "ERROR: No .ipa file found in build/output."
            exit 1
          fi

      - name: 🗂️ Upload Build Artifacts (IPA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REScout-iOS-Package
          path: build/output/
          if-no-files-found: ignore

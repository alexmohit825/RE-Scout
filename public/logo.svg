<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <linearGradient id="logoEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="logoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Isometric Building & Valuation Spark Icon -->
  <g transform="translate(32, 32)" filter="url(#logoGlow)">
    <polygon points="0,-18 16,-9 16,14 0,5" fill="url(#logoEmeraldGrad)" opacity="0.95" />
    <polygon points="0,-18 -16,-9 -16,14 0,5" fill="url(#logoCyanGrad)" opacity="0.9" />
    <polygon points="0,-18 16,-9 0,-1 -16,-9" fill="#10b981" />
    <circle cx="0" cy="-18" r="3" fill="#ffffff" />
    <!-- Yield trend spark -->
    <path d="M -18,12 Q -5,14 0,5 Q 5,-4 18,-12" fill="none" stroke="url(#logoGoldGrad)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="64" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="21" fill="#f8fafc" letter-spacing="-0.5">Value <tspan fill="#34d399">RE Scout</tspan></text>
  <rect x="220" y="19" width="46" height="18" rx="9" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
  <text x="243" y="31" font-family="JetBrains Mono, monospace" font-weight="700" font-size="10" fill="#34d399" text-anchor="middle">v2.0</text>
  <text x="65" y="48" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-weight="600" font-size="9" fill="#94a3b8" letter-spacing="0.6">MULTI-UNIT &amp; INDUSTRIAL YIELD UNDERWRITER</text>
</svg>
